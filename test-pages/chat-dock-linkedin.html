<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>chat-dock-linkedin</title>
    <style>
      html, body { margin: 0; padding: 0; background: #202020; }

      /* LinkedIn's messaging dock, in the shape the real one has: the pinned
         element is a *container* whose own box collapses to nothing, and the
         bubble people actually see is an absolutely-positioned child of it.
         The size guard measured the container, found it smaller than the
         minimum, and skipped it — so nothing in the dock was ever hidden. */
      #msg-overlay {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 0;
        height: 0;
        z-index: 100;
      }
      #msg-overlay .bubble {
        position: absolute;
        right: 16px;
        bottom: 0;
        width: 300px;
        height: 400px;
        background: rgb(255, 0, 255);
        color: #fff;
        font: 14px monospace;
      }

      /* The second way a dock survives being hidden: `visibility` is an
         inherited property, so a descendant that sets `visibility: visible`
         re-shows itself even inside a hidden ancestor. Hiding the container
         is not enough on its own. */
      #intercom-container {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 220px;
        height: 300px;
        background: rgb(0, 255, 255);
        z-index: 100;
      }
      #intercom-container .launcher {
        visibility: visible;
        width: 220px;
        height: 300px;
        background: rgb(0, 255, 255);
      }

      /* Wide *and* tall: real content the size guard exists to protect. It
         must still survive. */
      #wide-sticky { position: sticky; top: 0; width: 100%; height: 320px; background: rgb(0, 255, 0); }
      .band { height: 100px; width: 100%; box-sizing: border-box; color: #fff; font: 14px monospace; padding-top: 4px; }
    </style>
  </head>
  <body>
    <div id="wide-sticky">wide sticky content</div>
    <div id="bands"></div>
    <aside id="msg-overlay" class="msg-overlay-container">
      <div class="bubble">Messaging</div>
    </aside>
    <div id="intercom-container"><div class="launcher">Chat</div></div>
    <script>
      const container = document.getElementById("bands");
      for (let i = 0; i < 20; i++) {
        const div = document.createElement("div");
        div.className = "band";
        // Deliberately avoids pure magenta/cyan/green so the counts below
        // measure the docks and the sticky header, nothing else.
        div.style.backgroundColor = `rgb(${40 + i * 5},${60 + i * 3},${90 + i * 4})`;
        div.textContent = `band ${i}`;
        container.appendChild(div);
      }
    </script>
  </body>
</html>
