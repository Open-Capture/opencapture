<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>chat-dock-linkedin</title>
    <style>
      html, body { margin: 0; padding: 0; background: #202020; }

      /* LinkedIn's messaging dock, in the shape the real one has: the pinned
         element is a *container* whose own box collapses to nothing, and the
         bubble people actually see is an absolutely-positioned child of it.
         The size guard measured the container, found it smaller than the
         minimum, and skipped it — so nothing in the dock was ever hidden. */
      #msg-overlay {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 0;
        height: 0;
        z-index: 100;
      }
      #msg-overlay .bubble {
        position: absolute;
        right: 16px;
        bottom: 0;
        width: 300px;
        height: 400px;
        background: rgb(255, 0, 255);
        color: #fff;
        font: 14px monospace;
      }

      /* The second way a dock survives being hidden: `visibility` is an
         inherited property, so a descendant that sets `visibility: visible`
         re-shows itself even inside a hidden ancestor. Hiding the container
         is not enough on its own. */
      /* The shape that kept slipping through: the pinned node is an
         ANONYMOUS wrapper — nothing in its own id/class says "chat" — and the
         panel you can see is an absolutely-positioned child that carries the
         recognisable name. Reading only the wrapper's own attributes matched
         nothing, and measuring only its collapsed box hid it from every size
         check, so it was re-photographed into every slice. */
      #app-shell-anchor-7 {
        position: fixed;
        right: 260px;
        bottom: 0;
        width: 0;
        height: 0;
        z-index: 100;
      }
      #app-shell-anchor-7 .msg-overlay-conversation-bubble {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 260px;
        height: 380px;
        background: rgb(255, 128, 0);
        color: #fff;
        font: 14px monospace;
      }
      /* LinkedIn as it actually ships today: hashed class names, nothing
         that any list of widget names could ever match, and position:sticky
         rather than fixed. Only its shape gives it away — small on both
         axes, below the midline, parked against the bottom edge. */
      ._6116e3cc.fe61ecd8 {
        /* The real one is position:sticky; fixed is used here because it
           reproduces the same on-screen persistence deterministically,
           and the classifier keys on geometry rather than which of the two
           it is. The real sticky measurements are covered in pinned.test.ts. */
        position: fixed;
        right: 40px;
        bottom: 51px;
        width: 304px;
        height: 408px;
        background: rgb(0, 0, 255);
        color: #fff;
        font: 14px monospace;
      }
      #intercom-container {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 220px;
        height: 300px;
        background: rgb(0, 255, 255);
        z-index: 100;
      }
      #intercom-container .launcher {
        visibility: visible;
        width: 220px;
        height: 300px;
        background: rgb(0, 255, 255);
      }

      /* Wide *and* tall: real content the size guard exists to protect. It
         must still survive. */
      #wide-sticky { position: sticky; top: 0; width: 100%; height: 320px; background: rgb(0, 255, 0); }
      .band { height: 100px; width: 100%; box-sizing: border-box; color: #fff; font: 14px monospace; padding-top: 4px; }
    </style>
  </head>
  <body>
    <div id="wide-sticky">wide sticky content</div>
    <div id="bands"></div>
    <aside id="msg-overlay" class="msg-overlay-container">
      <div class="bubble">Messaging</div>
    </aside>
    <div id="app-shell-anchor-7"><div class="msg-overlay-conversation-bubble">Messaging</div></div>
    <div class="_6116e3cc fe61ecd8 _6184b856">Messaging (hashed classes)</div>
    <div id="intercom-container"><div class="launcher">Chat</div></div>
    <script>
      const container = document.getElementById("bands");
      for (let i = 0; i < 20; i++) {
        const div = document.createElement("div");
        div.className = "band";
        // Deliberately avoids pure magenta/cyan/green so the counts below
        // measure the docks and the sticky header, nothing else.
        div.style.backgroundColor = `rgb(${40 + i * 5},${60 + i * 3},${90 + i * 4})`;
        div.textContent = `band ${i}`;
        container.appendChild(div);
      }
    </script>
  </body>
</html>
