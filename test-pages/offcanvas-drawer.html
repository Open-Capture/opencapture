<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>offcanvas-drawer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .band {
        height: 100px;
        width: 100%;
        box-sizing: border-box;
        color: white;
        font: 14px monospace;
        padding-top: 4px;
      }
      /* A navigation drawer parked off-canvas until its button is pressed,
         the way mobile Wikipedia's is: full height, as wide as the window,
         scrollable, and entirely left of the viewport. */
      #drawer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        overflow-y: auto;
        transform: translateX(-100%);
        background: #222;
      }
      #drawer div {
        height: 8000px;
      }
    </style>
  </head>
  <body>
    <nav id="drawer"><div>menu</div></nav>
    <div id="bands"></div>
    <script>
      // Same 30 bands as ruler-3000.html.
      const BANDS = 30;
      const container = document.getElementById("bands");
      for (let i = 0; i < BANDS; i++) {
        const r = (i * 53) % 256;
        const g = (i * 97) % 256;
        const b = (i * 151) % 256;
        const div = document.createElement("div");
        div.className = "band";
        div.style.backgroundColor = `rgb(${r},${g},${b})`;
        div.textContent = `band ${i} rgb(${r},${g},${b})`;
        container.appendChild(div);
      }
    </script>
  </body>
</html>
