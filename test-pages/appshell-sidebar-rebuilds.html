<!doctype html>
<meta charset="utf-8" />
<title>App shell whose sidebar rebuilds itself</title>
<!--
  appshell-sidebar.html, except the column is re-rendered the way a framework
  re-renders: the node is REPLACED, not restyled. chatgpt.com's conversation
  list does this while signed in — it is live data — and a capture of a long
  thread runs for twenty-odd slices, so replacements land mid-capture.

  The column is a direct child of the shell on purpose. A wrapper around it
  would be a stable thing to hold onto, and holding onto one is what made this
  look fixed; here the element found at prep time is the element thrown away.

  ?noid drops the column's id, which is the harder half: with an id it can be
  hidden by a rule that matches whatever the page rebuilds, and without one
  nothing but finding it again per slice will do.

  The marker counts how many times the column's content is painted. Once.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #shell { display: flex; height: 100vh; }
  .rail {
    width: 240px;
    flex: 0 0 240px;
    height: 100vh;
    background: rgb(20, 30, 40);
    color: #fff;
    font: 14px/1.4 system-ui, sans-serif;
  }
  .marker { height: 60px; margin: 24px 16px; background: rgb(255, 0, 0); }
  .rail p { margin: 12px 16px; }
  #pane { flex: 1 1 auto; height: 100vh; overflow-y: auto; background: #fff; }
  .row {
    height: 140px;
    margin: 20px;
    background: rgb(0, 0, 255);
    color: #fff;
    font: 16px/140px system-ui, sans-serif;
    text-align: center;
  }
</style>
<div id="shell">
  <div id="pane">
    <div class="row">1</div><div class="row">2</div><div class="row">3</div>
    <div class="row">4</div><div class="row">5</div><div class="row">6</div>
    <div class="row">7</div><div class="row">8</div><div class="row">9</div>
    <div class="row">10</div><div class="row">11</div><div class="row">12</div>
    <div class="row">13</div><div class="row">14</div><div class="row">15</div>
  </div>
</div>
<script>
  const shell = document.getElementById("shell");
  const pane = document.getElementById("pane");
  const withId = !new URLSearchParams(location.search).has("noid");
  let current = null;
  let n = 0;
  function render() {
    const rail = document.createElement("nav");
    rail.className = "rail";
    if (withId) rail.id = "sidebar";
    const marker = document.createElement("div");
    marker.className = "marker";
    const a = document.createElement("p");
    a.textContent = "Conversations " + n++;
    const b = document.createElement("p");
    b.textContent = "Settings";
    rail.append(marker, a, b);
    if (current) current.remove();
    shell.insertBefore(rail, pane);
    current = rail;
  }
  render();
  setInterval(render, 250);
</script>
