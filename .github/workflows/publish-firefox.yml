name: Publish to Firefox Add-ons

# Triggered by a version tag (v0.1.1, v0.2.0, ...) so a release is a
# deliberate, reviewed act — bump the version in package.json and
# manifest.firefox.json, commit, tag, push the tag. workflow_dispatch is
# there for re-running a publish (e.g. after AMO rejected a submission
# and it needs resubmitting) without cutting a new tag.
on:
  push:
    tags:
      # Release tags publish. Pre-release tags — anything with a hyphen, like
      # v1.0.0-rc.1 — deliberately do not: they exist so a build can be handed
      # round for checking, and a store submission cannot be recalled once it
      # enters review. The GitHub Release workflow still builds artifacts for
      # them, which is the whole point of cutting one.
      - "v*"
      - "!v*-*"
  workflow_dispatch:

env:
  WASM_BINDGEN_VERSION: "0.2.100"

jobs:
  publish-firefox:
    name: build, sign, submit to AMO
    runs-on: ubuntu-latest
    steps:
      # apps/extension/vendor-private/watermark-premium is a private
      # submodule (the Supporter watermark feature) — actions/checkout
      # can't fetch it with the default GITHUB_TOKEN, which is scoped to
      # this repo only. Same deploy-key setup as ci.yml's wasm-build job;
      # see that job's comment for why recursive checkout alone doesn't
      # work and the key has to be scoped read-only to this one repo.
      - name: Set up deploy key for the private watermark submodule
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WATERMARK_PREMIUM_DEPLOY_KEY }}" > ~/.ssh/watermark_premium_deploy
          chmod 600 ~/.ssh/watermark_premium_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/watermark_premium_deploy"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
      - uses: actions/checkout@v4
      - name: Fetch the private watermark submodule
        run: git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (pinned)
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
        working-directory: apps/extension
      # web-ext reads the version to submit straight out of
      # dist-firefox/manifest.json — bump it in manifest.firefox.json (and
      # package.json, to keep them matching) before tagging, or AMO
      # rejects the upload as a duplicate of whatever's already live.
      - name: Sign and submit to addons.mozilla.org
        run: npm run publish:firefox
        working-directory: apps/extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      - name: Upload the signed .xpi as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: apps/extension/web-ext-artifacts/*.xpi
          if-no-files-found: warn
