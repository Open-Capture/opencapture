name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Must match the `wasm-bindgen = "=X.Y.Z"` pin in Cargo.toml exactly — the
  # CLI and crate versions are schema-coupled (see PLAN.md's build notes).
  WASM_BINDGEN_VERSION: "0.2.100"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm-build:
    name: wasm build + extension typecheck/build
    runs-on: ubuntu-latest
    steps:
      # apps/extension/vendor-private/watermark-premium is a private
      # submodule (the Supporter watermark feature) — actions/checkout
      # can't fetch it with the default GITHUB_TOKEN, which is scoped to
      # this repo only. A read-only deploy key on that one repo, not a
      # broader account PAT, so a leaked secret here can't reach anything
      # else.
      - name: Set up deploy key for the private watermark submodule
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WATERMARK_PREMIUM_DEPLOY_KEY }}" > ~/.ssh/watermark_premium_deploy
          chmod 600 ~/.ssh/watermark_premium_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/watermark_premium_deploy"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
      # submodules: recursive on actions/checkout itself doesn't work here:
      # it rewrites submodule URLs to https://github.com/ with the current
      # job's own GITHUB_TOKEN embedded (documented behavior, meant to make
      # public submodules "just work") — that token has no access to a
      # different private repo, so it 404s before the SSH deploy key above
      # ever gets a chance to be used. Checking out the main repo alone,
      # then updating submodules as its own step, leaves the SSH config
      # from the previous step in charge instead.
      - uses: actions/checkout@v4
      - name: Fetch the private watermark submodule
        run: git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (pinned)
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
        working-directory: apps/extension
      # typecheck needs src/wasm-gen/ (the wasm-bindgen glue) to already
      # exist — background/wasm-loader.ts and editor/editor.ts import it
      # directly, and it's gitignored/generated, not committed. Running
      # this first is cheaper than the full `npm run build` and keeps
      # typecheck failing on real type errors instead of a missing module.
      - run: npm run build:wasm
        working-directory: apps/extension
      - run: npm run typecheck
        working-directory: apps/extension
      - run: npm test
      # The publish/listing scripts are plain .mjs driven by mock servers,
      # so vitest never sees them. Without this a broken release script —
      # or a stale assertion in its tests — reaches main with CI green.
      - run: npm run test:scripts
        working-directory: apps/extension
      - run: npm run build
        working-directory: apps/extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: apps/extension/dist
      - run: npm run build:firefox
        working-directory: apps/extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist-firefox
          path: apps/extension/dist-firefox

  e2e:
    name: playwright e2e (real headless Chrome)
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      # See wasm-build's identical step for why this exists.
      - name: Set up deploy key for the private watermark submodule
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WATERMARK_PREMIUM_DEPLOY_KEY }}" > ~/.ssh/watermark_premium_deploy
          chmod 600 ~/.ssh/watermark_premium_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/watermark_premium_deploy"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
      # submodules: recursive on actions/checkout itself doesn't work here:
      # it rewrites submodule URLs to https://github.com/ with the current
      # job's own GITHUB_TOKEN embedded (documented behavior, meant to make
      # public submodules "just work") — that token has no access to a
      # different private repo, so it 404s before the SSH deploy key above
      # ever gets a chance to be used. Checking out the main repo alone,
      # then updating submodules as its own step, leaves the SSH config
      # from the previous step in charge instead.
      - uses: actions/checkout@v4
      - name: Fetch the private watermark submodule
        run: git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (pinned)
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - name: Build shot-qa (used by e2e assertions)
        run: cargo build -p shot-qa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
        working-directory: apps/extension
      - run: npx playwright install --with-deps chromium
        working-directory: apps/extension
      - name: Build extension (E2E test hook enabled)
        run: OPENCAPTURE_E2E=1 npm run build
        working-directory: apps/extension
      - name: Run e2e suite
        run: npx playwright test
        working-directory: apps/extension
        env:
          SHOT_QA_BIN: ${{ github.workspace }}/target/debug/shot-qa
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          retention-days: 7
