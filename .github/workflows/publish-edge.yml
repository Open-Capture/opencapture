name: Publish to Microsoft Edge Add-ons

# Same trigger shape as publish-firefox.yml: a version tag makes a release a
# deliberate act, and workflow_dispatch is there to re-run a publish (for
# example after Edge certification rejects a submission) without cutting a
# new tag.
#
# This publishes the *Chromium* build — the same artifact Chrome Web Store
# takes — because Edge runs Chromium and uses manifest.json, not
# manifest.firefox.json.
#
# Only the package is automated. Edge's Update REST API has no endpoint for
# listing metadata, so the per-language Overview and search terms in
# store-listing/ stay a manual Partner Center step.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#
#   EDGE_PRODUCT_ID  The product's GUID, from Partner Center > Microsoft Edge
#                    > Overview > (the extension) > Extension identity. This
#                    is NOT the id in the public microsoftedge.microsoft.com
#                    store URL — that one is the storefront id and the API
#                    rejects it.
#   EDGE_CLIENT_ID   Partner Center > Microsoft Edge > Publish API > Client ID.
#   EDGE_API_KEY     Partner Center > Microsoft Edge > Publish API > API key.
#                    Shown once at creation; regenerate if lost. Keys carry an
#                    expiry date, so a publish that suddenly 401s is usually an
#                    expired key rather than a code change.
#
# These use the v1.1 auth scheme (ApiKey + X-ClientID headers). v1's Azure AD
# access-token flow reached end of support on 2024-12-31.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes for Edge certification"
        required: false
        default: "Automated publish from CI."

env:
  WASM_BINDGEN_VERSION: "0.2.100"

jobs:
  publish-edge:
    name: build, package, submit to Edge Add-ons
    runs-on: ubuntu-latest
    steps:
      # apps/extension/vendor-private/watermark-premium is a private
      # submodule (the Supporter watermark feature) — actions/checkout
      # can't fetch it with the default GITHUB_TOKEN, which is scoped to
      # this repo only. Same deploy-key setup as ci.yml's wasm-build job.
      - name: Set up deploy key for the private watermark submodule
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WATERMARK_PREMIUM_DEPLOY_KEY }}" > ~/.ssh/watermark_premium_deploy
          chmod 600 ~/.ssh/watermark_premium_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/watermark_premium_deploy"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
      - uses: actions/checkout@v4
      - name: Fetch the private watermark submodule
        run: git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (pinned)
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
        working-directory: apps/extension
      - name: Build the Chromium extension
        run: npm run build
        working-directory: apps/extension
      # Zip the *contents* of dist/, not the directory itself — the store
      # rejects a package whose manifest.json is nested one level down.
      - name: Package dist/ as a zip
        run: |
          cd apps/extension/dist
          zip -r -q ../edge-package.zip .
          unzip -l ../edge-package.zip | head -5
      - name: Upload and publish to Edge Add-ons
        run: node scripts/publish-edge.mjs edge-package.zip
        working-directory: apps/extension
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PUBLISH_NOTES: ${{ inputs.notes || format('Release {0}', github.ref_name) }}
      - name: Upload the package as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-package
          path: apps/extension/edge-package.zip
          if-no-files-found: warn
