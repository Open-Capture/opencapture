<!doctype html>
<html class="oa-auto">
  <head>
    <meta charset="utf-8" />
    <title>OpenCapture Editor</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        /* #canvasWrap filling "whatever's left" via flex rather than a
           hardcoded `height: calc(100% - <toolbar height>px)` — the
           toolbar's actual height isn't a fixed constant: it wraps to a
           second line on a narrow window or once enough buttons are added,
           and a stale hardcoded offset silently pushes canvasWrap's box
           past the bottom of the viewport when that happens. */
        display: flex;
        flex-direction: column;
      }
      #toolbar {
        display: flex;
        gap: 6px;
        padding: var(--space-2) var(--space-3);
        background: var(--surface-card);
        border-bottom: var(--border-width) solid var(--border-hairline);
        align-items: center;
        flex-wrap: wrap;
        flex: 0 0 auto;
      }
      /* Segmented containers do the grouping visually, so the toolbar gains a
         row of labels without also gaining a row of group headings. */
      .field-inline {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font: var(--type-ui);
        color: var(--text-body);
        cursor: pointer;
      }
      .field-inline input {
        accent-color: var(--brand);
        margin: 0;
      }
      .tool-group {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        background: var(--bg-sunken);
        border: var(--border-width) solid var(--border-hairline);
        border-radius: var(--radius-md);
      }
      .tool-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-width: 42px;
        padding: 4px 5px 3px;
        border: var(--border-width) solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: var(--transition-control);
      }
      .tool-btn:hover:not(:disabled) {
        background: var(--surface-hover);
        color: var(--text-strong);
      }
      .tool-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .tool-btn:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      .tool-label {
        font: var(--type-caption);
        font-size: 10px;
        /* Fixed, not 1: the count badge is added and removed as you edit, and
           anything that lets it change this line box changes the button
           height, then the toolbar height, then where the canvas starts —
           which moved the canvas by half a pixel mid-session and shifted
           every subsequent drag. The strip must not reflow while in use. */
        line-height: 12px;
        height: 12px;
        white-space: nowrap;
      }
      /* Undo sits outside the tool groups — it acts on history, not on a
         selection — but matches their shape so the row reads as one control
         strip rather than two kinds of button. */
      /* The count rides on the label rather than taking a line of its own, so
         adding it costs width instead of toolbar height. Superscripted so a
         two-digit count still reads as a count and not as part of the word. */
      .tool-count {
        margin-left: 2px;
        font-size: 9px;
        /* Raised by position, not vertical-align: super, which grows the line
           box it sits in. inline-block + fixed line-height keeps it out of
           layout entirely. */
        display: inline-block;
        position: relative;
        top: -2px;
        line-height: 12px;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }
      .tool-btn:disabled .tool-count {
        display: none;
      }
      .toolbar-divider {
        width: var(--border-width);
        align-self: stretch;
        background: var(--border-hairline);
        margin: 0 var(--space-1);
      }
      #toolbar .tool-btn.active {
        background: var(--surface-selected);
        color: var(--text-brand);
        border-color: var(--border-hairline);
      }
      #cropBar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: var(--space-5);
        z-index: 30;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2);
        background: var(--surface-card);
        border: var(--border-width) solid var(--border-hairline);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
      }
      /* The attribute has to beat the display:flex above, which would
         otherwise keep the bar on screen with nothing pending. */
      #cropBar[hidden] {
        display: none;
      }
      .crop-bar-divider {
        width: var(--border-width);
        align-self: stretch;
        background: var(--border-hairline);
        margin: 0 var(--space-1);
      }
      #cropSize {
        font: var(--type-ui);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--text-brand);
        white-space: nowrap;
      }
      .crop-out {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .crop-out input {
        width: 56px;
        padding: 2px 6px;
        border: var(--border-width) solid var(--border-hairline);
        border-radius: var(--radius-sm);
        background: var(--surface-card);
        color: var(--text-body);
        font: var(--type-ui);
        text-align: center;
      }
      .crop-out input:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      #status {
        margin-left: auto;
      }
      #canvasWrap {
        overflow: auto;
        padding: var(--space-6);
        flex: 1 1 auto;
        box-sizing: border-box;
        background: var(--bg-page);
      }
      #canvasStack {
        position: relative;
      }
      #canvas {
        cursor: crosshair;
        box-shadow: var(--shadow-lg);
        background: #fff;
        /* Suppresses native touch scroll/pinch while a drag tool is active
           on the canvas itself — #canvasWrap (above) deliberately keeps its
           own default touch-action, so panning still works there when no
           drag is in progress. */
        touch-action: none;
        /* Fit the window's available width instead of always rendering at
           native pixel size — a retina/high-DPR capture's canvas.width is
           up to 2-3x its CSS px size on the original page, so without this
           it displays that much too large. height:auto preserves aspect
           ratio; margin:auto centers it once it's narrower than the wrap. */
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }
      #framePanel {
        position: absolute;
        top: 0;
        right: var(--space-3);
        z-index: 40;
        width: 300px;
        display: grid;
        gap: var(--space-3);
        padding: var(--space-4);
      }
      #framePanel[hidden] {
        display: none;
      }
      #frameActions {
        display: flex;
        gap: var(--space-2);
        justify-content: flex-end;
      }
      #frameUrlPreview {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Zoomed past the window, the image is panned by scrolling the wrap, so
         it must not stay centred or the left edge becomes unreachable. */
      #canvas.is-zoomed {
        max-width: none;
        margin: 0;
      }
      /* Live drag previews (arrow/rect/blur outline, crop marquee+handles)
         render here instead of on #canvas — editor.ts positions/sizes this
         in JS to exactly overlay #canvas's own (possibly scaled, possibly
         centered) rendered box. Keeping previews off the main canvas means
         a mousemove during a drag never touches that canvas's pixel data
         at all (no getImageData/putImageData), which for a large capture
         was the actual cause of very laggy dragging — a full-canvas pixel
         copy on every mousemove, regardless of how small the visible
         preview shape was. */
      #previewCanvas {
        position: absolute;
        pointer-events: none;
      }
      #saveSettingsBtn {
        max-width: 160px;
      }
      #saveSettingsBtn span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #editorCustomFolderRow {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      #editorCustomFolderName {
        flex: 1;
        min-width: 0;
      }
      #saveSettingsPanel {
        position: absolute;
        top: calc(var(--space-2) + 44px);
        left: var(--space-4);
        z-index: 1000;
        width: 280px;
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      /* [hidden]'s UA display:none loses to the unconditional display:flex
         above on specificity alone — this ID+[hidden] selector outranks
         it. Same trap every other panel in this file avoids the same way. */
      #saveSettingsPanel[hidden] {
        display: none;
      }
      #watermarkPanel {
        position: absolute;
        top: calc(var(--space-2) + 44px);
        right: var(--space-4);
        z-index: 1000;
        width: 280px;
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      /* Visibility toggled by a class, not the [hidden] attribute — a
         previous version of this file gave #watermarkPanel an unconditional
         display:flex whose specificity silently beat [hidden]'s
         display:none, leaving that panel visible (and eating clicks meant
         for the canvas) the whole time. Not repeating that here. */
      #splitNotice {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-4);
        background: var(--surface-selected);
        border-bottom: var(--border-width) solid var(--border-hairline);
        font-size: 13px;
      }
      #splitNotice.visible {
        display: flex;
      }
      /* The [hidden] attribute's UA-stylesheet `display:none` loses to the
         `display:flex` above on specificity alone (equal-specificity ID
         selectors resolve by source order, and [hidden] isn't one) — without
         this, the panel stays visible and, worse, sits on top of the canvas
         intercepting its mouse events even while "hidden". This selector's
         extra [hidden] clause outranks the bare #watermarkPanel one above,
         so it wins regardless of source order. */
      #watermarkPanel[hidden] {
        display: none;
      }
      #watermarkGatePanel {
        position: absolute;
        top: calc(var(--space-2) + 44px);
        right: var(--space-4);
        z-index: 1000;
        width: 280px;
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      /* Same [hidden]-vs-display:flex specificity trap as #watermarkPanel
         above — see that rule's comment. */
      #watermarkGatePanel[hidden] {
        display: none;
      }
      /* Column, not a side-by-side row: the action label varies ("Sign in"
         vs "Unlock for 1000 credits" vs "Buy credits"), and paired with
         "Cancel" in this 280px panel the longer labels don't fit — a
         flex-end row with no wrap overflows past the panel's own left
         edge rather than wrapping, since the row is anchored to the right.
         Stacking removes the fit problem regardless of label length. */
      #watermarkGateActions {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      #watermarkLogoRow {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      #watermarkLogoPreview {
        width: 28px;
        height: 28px;
        object-fit: contain;
        border-radius: var(--radius-sm);
        border: var(--border-width) solid var(--border-hairline);
        background: var(--bg-subtle);
      }
      #watermarkLogoName {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #watermarkActions {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-2);
      }
      .field-label-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-2);
      }
      #watermarkPreview {
        display: block;
        width: 100%;
        height: 160px;
        background: var(--bg-subtle);
        border: var(--border-width) solid var(--border-hairline);
        border-radius: var(--radius-sm);
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <!-- Grouped by what the tool does to the image, not by how it is drawn:
           choosing/framing, adding marks, and covering something up. The
           watermark sits with blur because both put a layer over the picture
           rather than annotate it, and it is the one paid tool — being last
           keeps the free set contiguous. -->
      <div class="tool-group" role="group" aria-label="Select and frame">
        <button id="toolSelect" class="tool-btn" data-tool="select" title="Select and move shapes">
          <span class="oa-icon icon-mouse-pointer-2"></span>
          <span class="tool-label">Select</span>
        </button>
        <button id="toolCrop" class="tool-btn" data-tool="crop" title="Crop the image">
          <span class="oa-icon icon-crop"></span>
          <span class="tool-label">Crop</span>
        </button>
      </div>
      <div class="tool-group" role="group" aria-label="Annotate">
        <button id="toolArrow" class="tool-btn" data-tool="arrow" title="Draw an arrow">
          <span class="oa-icon icon-arrow-up-right"></span>
          <span class="tool-label">Arrow</span>
        </button>
        <button id="toolRect" class="tool-btn" data-tool="rect" title="Draw a rectangle">
          <span class="oa-icon icon-square"></span>
          <span class="tool-label">Box</span>
        </button>
        <button id="toolText" class="tool-btn" data-tool="text" title="Add text">
          <span class="oa-icon icon-type"></span>
          <span class="tool-label">Text</span>
        </button>
      </div>
      <div class="tool-group" role="group" aria-label="Cover up">
        <button id="toolBlur" class="tool-btn" data-tool="blur" title="Blur or redact an area">
          <span class="oa-icon icon-grid-2x2"></span>
          <span class="tool-label">Blur</span>
        </button>
        <button id="toolWatermark" class="tool-btn" data-tool="watermark" title="Add a tiled watermark">
          <span class="oa-icon icon-image"></span>
          <span class="tool-label">Watermark</span>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <!-- Undo and Redo are one group: they are the same control in two
           directions, and pairing them makes the counts readable as "3 back,
           1 forward" rather than two unrelated numbers. -->
      <div class="tool-group" role="group" aria-label="Presentation">
        <button id="toolFrame" class="tool-btn" data-tool="frame" title="Put the screenshot in a browser window">
          <span class="oa-icon icon-square"></span>
          <span class="tool-label">Frame</span>
        </button>
      </div>
      <!-- Zoom sits in the toolbar with every other control, not floating over
           the image. It used to be a bare "- Fit + Fit" strip in the bottom
           corner: nothing in it said "zoom", it duplicated the word "Fit"
           twice, and it was the only control outside the labelled groups —
           so it read as missing rather than as a feature. -->
      <div class="tool-group" role="group" aria-label="Zoom">
        <button id="zoomOut" class="tool-btn" title="Zoom out (Ctrl/Cmd -)">
          <span class="oa-icon icon-zoom-out"></span>
          <span class="tool-label">Zoom out</span>
        </button>
        <button id="zoomLevel" class="tool-btn" title="Switch between 100% and fit (Ctrl/Cmd 0)">
          <span class="oa-icon icon-maximize"></span>
          <span class="tool-label" id="zoomLevelLabel">Fit</span>
        </button>
        <button id="zoomIn" class="tool-btn" title="Zoom in (Ctrl/Cmd +)">
          <span class="oa-icon icon-zoom-in"></span>
          <span class="tool-label">Zoom in</span>
        </button>
        <button id="zoomFit" class="tool-btn" title="Fit the whole image in the window">
          <span class="oa-icon icon-crop"></span>
          <span class="tool-label">Fit</span>
        </button>
      </div>
      <div class="tool-group" role="group" aria-label="History">
        <button id="undo" class="tool-btn" title="Undo the last change">
          <span class="oa-icon icon-undo-2"></span>
          <span class="tool-label">Undo<span id="undoCount" class="tool-count"></span></span>
        </button>
        <button id="redo" class="tool-btn" title="Redo the last undone change">
          <span class="oa-icon icon-redo-2"></span>
          <span class="tool-label">Redo<span id="redoCount" class="tool-count"></span></span>
        </button>
      </div>
      <button id="saveSettingsBtn" class="btn btn-secondary btn-sm" title="Change where this saves">
        <span class="oa-icon oa-icon-14 icon-folder-open"></span>
        <span id="saveSettingsLabel">Downloads</span>
      </button>
      <div class="toolbar-divider"></div>
      <button id="copyToClipboard" class="btn btn-secondary btn-sm">
        <span class="oa-icon oa-icon-14 icon-copy"></span>
        Copy
      </button>
      <button id="downloadPng" class="btn btn-secondary btn-sm">
        <span class="oa-icon oa-icon-14 icon-download"></span>
        PNG
      </button>
      <button id="downloadPdf" class="btn btn-secondary btn-sm">
        <span class="oa-icon oa-icon-14 icon-file-down"></span>
        PDF
      </button>
      <span id="status" class="oa-caption"></span>
      <button id="closeEditor" type="button" class="icon-btn" title="Close">
        <span class="oa-icon icon-x"></span>
      </button>
    </div>
    <!-- Contextual, and deliberately not in the toolbar. These two only exist
         while a crop is pending, and putting them in the toolbar meant the
         toolbar reflowed onto a second row the instant the marquee was
         drawn — which pushed the image down 40px mid-interaction, so the
         next grab at the corner handle landed 40px above it and collapsed
         the selection. A floating bar cannot change the toolbar's height,
         and it puts the confirmation next to the thing being confirmed. -->
    <div id="cropBar" hidden>
      <button id="cropApply" class="btn btn-primary btn-sm">
        <span class="oa-icon oa-icon-14 icon-check"></span>
        Apply crop
      </button>
      <button id="cropCancel" class="btn btn-secondary btn-sm">
        <span class="oa-icon oa-icon-14 icon-x"></span>
        Cancel
      </button>
      <span class="crop-bar-divider"></span>
      <!-- The same deal the selection overlay offers: see the size you are
           about to get, and pin it if you need a particular one. Cropping to
           a shape and cropping to a size are the same job. -->
      <span id="cropSize" role="status"></span>
      <span class="crop-out">
        <span class="oa-caption">Output</span>
        <input id="cropOutW" type="text" inputmode="numeric" placeholder="640" aria-label="Output width in pixels" />
        <span class="oa-caption">&times;</span>
        <input id="cropOutH" type="text" inputmode="numeric" placeholder="360" aria-label="Output height in pixels" />
      </span>
    </div>
    <div id="framePanel" class="card" hidden>
      <p class="oa-caption">Wrap the screenshot in a browser window. The chrome is drawn, never captured — your tabs and profile stay out of it.</p>
      <label class="field">
        <span class="field-label">Style</span>
        <span class="field-control">
          <select id="framePreset">
            <option value="none">None</option>
            <option value="macos">macOS &mdash; Safari</option>
            <option value="windows">Windows &mdash; Chrome</option>
            <option value="caption">Caption below</option>
          </select>
        </span>
      </label>
      <label class="field-inline"><input id="frameShowUrl" type="checkbox" checked /><span>Show URL</span></label>
      <label class="field-inline"><input id="frameShowDate" type="checkbox" /><span>Show date</span></label>
      <label class="field-inline"><input id="frameShowTime" type="checkbox" /><span>Show time</span></label>
      <p id="frameUrlPreview" class="field-hint"></p>
      <div id="frameActions">
        <button id="frameCancel" class="btn btn-secondary btn-sm" type="button">Cancel</button>
        <button id="frameApply" class="btn btn-primary btn-sm" type="button">Add frame</button>
      </div>
    </div>
    <div id="splitNotice">
      <span id="splitNoticeText"></span>
      <button id="splitNoticeClose" type="button" class="icon-btn" title="Dismiss">
        <span class="oa-icon oa-icon-14 icon-x"></span>
      </button>
    </div>
    <div id="saveSettingsPanel" class="card" hidden>
      <label class="field">
        <span class="field-label">Filename</span>
        <span class="field-control">
          <input id="editorPrefFilename" type="text" placeholder="opencapture" />
        </span>
      </label>
      <label class="field">
        <span class="field-label">Folder</span>
        <div id="editorCustomFolderRow">
          <span id="editorCustomFolderName" class="field-hint">Your Downloads folder (default)</span>
          <button id="editorBrowseFolder" type="button" class="btn btn-secondary btn-sm">
            <span class="oa-icon oa-icon-14 icon-folder-open"></span>
            Browse…
          </button>
        </div>
      </label>
      <label class="field-inline">
        <input id="editorPrefAskWhere" type="checkbox" />
        <span>Ask where to save each time</span>
      </label>
    </div>
    <div id="watermarkGatePanel" class="card" hidden>
      <p>Supporter feature</p>
      <p id="watermarkGateMessage" class="oa-caption"></p>
      <div id="watermarkGateActions">
        <button id="watermarkGateAction" class="btn btn-primary btn-sm btn-full" type="button"></button>
        <button id="watermarkGateCancel" class="btn btn-secondary btn-sm btn-full" type="button">Cancel</button>
      </div>
    </div>
    <div id="watermarkPanel" class="card" hidden>
      <div class="field">
        <span class="field-label">Preview</span>
        <canvas id="watermarkPreview" width="248" height="160"></canvas>
      </div>
      <label class="field">
        <span class="field-label">Watermark text</span>
        <span class="field-control">
          <input id="watermarkText" type="text" placeholder="e.g. Draft, Confidential…" />
        </span>
      </label>
      <div class="field">
        <span class="field-label">Logo image</span>
        <div id="watermarkLogoRow">
          <img id="watermarkLogoPreview" alt="" hidden />
          <span id="watermarkLogoName" class="field-hint">No logo chosen</span>
          <button id="watermarkChooseLogo" class="btn btn-secondary btn-sm" type="button">
            <span class="oa-icon oa-icon-14 icon-folder-open"></span>
            Choose…
          </button>
          <button id="watermarkRemoveLogo" class="btn btn-secondary btn-sm" type="button" hidden>Remove</button>
          <input id="watermarkLogoFile" type="file" accept="image/*" hidden />
        </div>
      </div>
      <label class="field">
        <span class="field-label-row">
          <span class="field-label">Text size</span>
          <span id="watermarkTextSizeValue" class="field-hint">100%</span>
        </span>
        <input id="watermarkTextSize" type="range" min="50" max="200" value="100" />
      </label>
      <label class="field">
        <span class="field-label-row">
          <span class="field-label">Opacity</span>
          <span id="watermarkOpacityValue" class="field-hint">15%</span>
        </span>
        <input id="watermarkOpacity" type="range" min="10" max="100" value="15" />
      </label>
      <label class="field">
        <span class="field-label">Location</span>
        <span class="field-control">
          <select id="watermarkLocation">
            <option value="full">Over the entire page</option>
            <option value="top">Top only</option>
            <option value="bottom">Bottom only</option>
            <option value="top-bottom">Top and bottom</option>
          </select>
        </span>
      </label>
      <label class="field">
        <span class="field-label">Orientation</span>
        <span class="field-control">
          <select id="watermarkOrientation">
            <option value="0">0°</option>
            <option value="45">45° (slanted)</option>
          </select>
        </span>
      </label>
      <div id="watermarkActions">
        <button id="watermarkCancel" class="btn btn-secondary btn-sm" type="button">Cancel</button>
        <button id="watermarkAdd" class="btn btn-primary btn-sm" type="button" disabled>Add watermark</button>
      </div>
    </div>
    <div id="canvasWrap">
      <div id="canvasStack">
        <canvas id="canvas"></canvas>
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>
